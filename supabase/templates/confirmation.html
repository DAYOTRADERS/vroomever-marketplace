<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your Vroomever account</title></head>
<body style="margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#152033">
<div style="max-width:600px;margin:40px auto;background:#fff;border-radius:16px;padding:40px;box-shadow:0 8px 30px rgba(15,23,42,.08)">
  <div style="font-size:28px;font-weight:800;color:#111827">Vroomever</div>
  <h1 style="font-size:28px;margin:28px 0 12px">Welcome to Vroomever</h1>
  <p style="font-size:16px;line-height:1.6;color:#667085">Please verify your email address to activate your Vroomever account.</p>
  <p style="margin:30px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700">Verify my Vroomever account</a></p>
  <p style="font-size:13px;line-height:1.6;color:#98a2b3">If you did not create a Vroomever account, you can ignore this email.</p>
</div>
</body>
</html>
